<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; connect-src 'none'">
  <title>Le carnet Epsiloon · Espace personnel</title>
  <style>
  *{box-sizing:border-box}body{margin:0;background:#f7f7f0;color:#203c33;font:14px/1.65 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:25px}.lock-shell{width:min(420px,100%)}.brand{display:flex;align-items:center;gap:12px;font-size:14px;margin-bottom:55px}.sign{display:grid;place-items:center;background:#e7ec75;border-radius:4px;font:38px Georgia,serif;width:43px;height:37px}.eyebrow{font-size:10px;letter-spacing:1.5px;color:#6b786f}h1{font:400 43px/1.15 Georgia,serif;letter-spacing:-1px;margin:13px 0}p{color:#6b786f;font-size:12px;margin:12px 0 28px}.field{display:flex;background:white;border:1px solid #dfe4da;border-radius:7px;margin:8px 0 16px;overflow:hidden}input{width:100%;min-width:0;padding:14px;font:16px system-ui;color:#203c33;border:0;background:none}label{font-size:12px}button{font:13px system-ui;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #3c6050;outline-offset:-3px}.show{padding:8px 12px;border:0;background:none;font-size:11px;color:#6b786f}.submit{width:100%;background:#203c33;color:#fff;border:0;border-radius:7px;padding:15px}.submit:disabled{opacity:.7;cursor:wait}.foot{margin:30px 0 0;padding-top:20px;border-top:1px solid #dfe4da;font-size:10px;color:#6b786f}.error{color:#a2382c;min-height:22px;font-size:12px;margin:12px 0 0}[hidden]{display:none!important}@media(prefers-color-scheme:dark){body{background:#161e19;color:#edf0e5}.field{background:#202a23;border-color:#38463b}input{color:#edf0e5}.submit{background:#dce773;color:#203c33}.foot{border-color:#38463b}p,.eyebrow,.foot,.show{color:#aab7ab}.error{color:#ffb7a8}}
  </style>
</head>
<body>
  <main class="lock-shell"><div class="brand"><span class="sign" aria-hidden="true">∞</span><span>le carnet <strong>epsiloon</strong></span></div><div class="eyebrow">MON ESPACE DE LECTURE</div><h1>Les idées<br>se retrouvent ici.</h1><p>Ouvre ton carnet pour retrouver les sujets,<br>les découvertes et ce que tu en as retenu.</p><form id="unlock" action="#"><label for="password">Ta phrase de passe</label><div class="field"><input id="password" type="password" autocomplete="current-password" required autofocus><button class="show" id="show" type="button" aria-label="Afficher la phrase de passe">Afficher</button></div><button id="submit" class="submit" type="submit">Ouvrir mon carnet →</button><p id="error" class="error" role="alert"></p></form><noscript>Active JavaScript pour ouvrir ce carnet.</noscript><p class="foot">Carnet personnel · Déverrouillage sur cet appareil.</p></main>
  <script>
  (() => {
    const engine = /*[|js_staticrypt|]*/0;
    const config = /*[|staticrypt_config|]*/0;
    const crypt = engine.init(config,{rememberExpirationKey:'epsiloon-unlock-expiry',rememberPassphraseKey:'epsiloon-unlock-key',replaceHtmlCallback:null,clearLocalStorageCallback:null});
    const form=document.getElementById('unlock'),input=document.getElementById('password'),submit=document.getElementById('submit'),error=document.getElementById('error');
    document.getElementById('show').addEventListener('click',event=>{const visible=input.type==='password';input.type=visible?'text':'password';event.target.textContent=visible?'Masquer':'Afficher';event.target.setAttribute('aria-label',visible?'Masquer la phrase de passe':'Afficher la phrase de passe');});
    form.addEventListener('submit',async event=>{event.preventDefault();error.textContent='';if(!window.isSecureContext||!window.crypto?.subtle){error.textContent='Ouvre le carnet en HTTPS ou via le serveur local de prévisualisation.';return;}submit.disabled=true;submit.textContent='Ouverture…';try{const result=await crypt.handleDecryptionOfPage(input.value,false);if(!result.isSuccessful){error.textContent='Cette phrase de passe ne correspond pas. Réessaie.';input.select();}}catch{error.textContent='Le carnet n’a pas pu être ouvert. Recharge la page et réessaie.';}finally{submit.disabled=false;submit.textContent='Ouvrir mon carnet →';}});
  })();
  </script>
</body>
</html>
